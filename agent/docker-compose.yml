services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: caremp-sentinel-agent:latest
    container_name: caremp-sentinel-agent
    ports:
      - "${PORT:-8000}:8080"
    env_file:
      - .env
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - BASE_URL=${BASE_URL:-}
      - API_BASE_URL=${API_BASE_URL:-}
      - USE_MOCK_API=${USE_MOCK_API:-false}
      - API_USER_EMAIL=${API_USER_EMAIL:-sadmin@caremp.ai}
      - API_USER_PASSWORD=${API_USER_PASSWORD:-sadmin@123#}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ADK_MODEL=${ADK_MODEL:-gemini-3.5-flash-lite}
      - ENGINES_API_URL=${ENGINES_API_URL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
