version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: caremp-sentinel-postgres
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-caremp_sentinel}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-caremp_sentinel}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - caremp-network

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: caremp-sentinel-api
    restart: unless-stopped
    ports:
      - "${PORT:-4000}:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-caremp_sentinel}
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - JWT_SECRET=${JWT_SECRET:-CAREMP_SENTINEL}
      - JWT_SECRET_EXPIRES=${JWT_SECRET_EXPIRES:-30d}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-CAREMP_SENTINEL_REFRESH}
      - JWT_REFRESH_EXPIRES=${JWT_REFRESH_EXPIRES:-30d}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - caremp-network

  engines:
    build:
      context: ./engines
      dockerfile: Dockerfile
    image: caremp-sentinel-engines:latest
    container_name: caremp-sentinel-engines
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - HOST=0.0.0.0
    networks:
      - caremp-network

  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    image: caremp-sentinel-agent:latest
    container_name: caremp-sentinel-agent
    restart: unless-stopped
    ports:
      - "8000:8080"
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - BASE_URL=http://api:4000/
      - API_BASE_URL=http://api:4000/v1
      - USE_MOCK_API=false
      - API_USER_EMAIL=${API_USER_EMAIL:-sadmin@caremp.ai}
      - API_USER_PASSWORD=${API_USER_PASSWORD:-sadmin@123#}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ADK_MODEL=gemini-2.5-flash
      - ENGINES_API_URL=http://engines:5001/engines
    depends_on:
      - api
      - engines
    networks:
      - caremp-network

volumes:
  pgdata:
    driver: local

networks:
  caremp-network:
    driver: bridge
